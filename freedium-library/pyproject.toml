[project]
name = "freedium-library"
version = "0.1.0"
description = "Default template for PDM package"
authors = [
    {name = "ZhymabekRoman", email = "robanokssamit@yandex.ru"},
]
dependencies = [
    "beartype>=0.22.9",
    "deprecation>=2.1.0",
    "orjson>=3.10.18",
    "pendulum>=3.1.0",
    "ujson>=5.10.0",
    "httpx[socks]>=0.28.1",
    "pymongo>=4.13.0",
    "motor>=3.7.1",
    "dependency-injector>=4.47.1",
    "loguru>=0.7.3",
    "pydantic-settings>=2.9.1",
    "curl-cffi>=0.15.0",
    "bs4>=0.0.2",
    "PyYAML>=6.0",
    "weasyprint>=62.0",
    "lxml>=5.0",
    "zstandard>=0.23.0",
    "taskiq>=0.11,<1.0",
    "taskiq-redis>=1.0,<2.0",
    "redis>=5.0",
]
requires-python = "==3.12.*"
readme = "README.md"
license = {text = "MIT"}


[project.optional-dependencies]
api = [
    "slowapi>=0.1.9",
    # Pinned: a transitive FastAPI bump to 0.137 (which added _IncludedRouter)
    # silently broke prometheus-fastapi-instrumentator's route resolver and
    # 500'd every /api route for ~17h. Pin both so a rebuild can't repeat it.
    "fastapi[standard]==0.137.1",
    "starlette==1.3.1",
    "prometheus-fastapi-instrumentator==8.0.0",
]
migrate = [
    "psycopg2-binary>=2.9.9",
]
bench = [
    "maturin>=1.7,<2.0",
]
[tool.pdm]
distribution = false


[dependency-groups]
dev = [
    "pytest-asyncio>=1.0.0",
    "pytest-httpx>=0.35.0",
    "pytest-xdist[psutil]>=3.7.0",
    "orjson>=3.10.18",
    "pytest-integration>=0.2.3",
    "pre-commit>=4.2.0",
    "freezegun>=1.5.2",
    "pytest-cov>=6.1.1",
    "pyright>=1.1.407",
    "pypdf>=5.0",
    "mongomock-motor>=0.0.27",
]

[tool.pyright]
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
