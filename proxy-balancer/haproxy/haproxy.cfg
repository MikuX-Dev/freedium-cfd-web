global
    log stdout format raw local0 debug

defaults
    timeout connect 5000
    timeout client  50000
    timeout server  50000

resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry   1s
    hold valid 10s

frontend socks5_in
    bind *:1080
    mode tcp
    default_backend warp

backend warp
    mode tcp
    balance roundrobin
    # server-template expands to N slots (warp1..warpN). Docker's embedded DNS
    # at 127.0.0.11 returns all replica IPs for service name `wgcf` (round
    # robin) so HAProxy fills the slots dynamically — no static hostnames.
    server-template warp 3 wgcf:1080 check resolvers docker init-addr libc,none
