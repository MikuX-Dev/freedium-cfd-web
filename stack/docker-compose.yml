name: freedium-obs

services:
  backend:
    build:
      context: ..
      dockerfile: freedium-library/Dockerfile
    container_name: freedium-backend
    environment:
      - ERROR_LOG_PATH=/var/log/freedium/errored-links.jsonl
      - PDF_INTERNAL_SECRET=${PDF_INTERNAL_SECRET:-dev-secret-change-me}
      - CACHE_ENABLED=${CACHE_ENABLED:-true}
      - MONGO_URL=mongodb://mongo:27017
      - MONGO_DB=${MONGO_DB:-freedium_cache}
      - MONGO_COLLECTION=${MONGO_COLLECTION:-post_cache}
    volumes:
      - errored_logs:/var/log/freedium
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - freedium_obs_net
    restart: unless-stopped

  mongo:
    image: mongo:7
    container_name: freedium-mongo
    command:
      - "--quiet"
      - "--logpath=/dev/null"
      - "--wiredTigerCollectionBlockCompressor=zstd"
      - "--wiredTigerJournalCompressor=zstd"
    volumes:
      - mongo_data:/data/db
    networks:
      - freedium_obs_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 5

  web:
    build:
      context: ../new-web
      dockerfile: Dockerfile
    container_name: freedium-web
    environment:
      - PUBLIC_API_BASE_URL=http://backend:7080
      - PUBLIC_API_URL=http://backend:7080/api
      - PDF_INTERNAL_SECRET=${PDF_INTERNAL_SECRET:-dev-secret-change-me}
      - PDF_SERVICE_URL=http://backend:7080
      - PDF_SERVICE_SECRET=${PDF_INTERNAL_SECRET:-dev-secret-change-me}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - freedium_obs_net
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: freedium-prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom_data:/prometheus
    networks:
      - freedium_obs_net
    restart: unless-stopped

  loki:
    image: grafana/loki:3.3.0
    container_name: freedium-loki
    command: -config.file=/etc/loki/config.yml
    volumes:
      - ./loki/config.yml:/etc/loki/config.yml:ro
      - loki_data:/loki
    networks:
      - freedium_obs_net
    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.3.0
    container_name: freedium-promtail
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./promtail/config.yml:/etc/promtail/config.yml:ro
      - errored_logs:/var/log/freedium:ro
      - promtail_data:/var/lib/promtail
    depends_on:
      - loki
    networks:
      - freedium_obs_net
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.4.0
    container_name: freedium-grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_ADMIN_PASSWORD:-admin}
      - GF_USERS_DEFAULT_THEME=dark
      - GF_AUTH_ANONYMOUS_ENABLED=${GF_ANON_ENABLED:-false}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    depends_on:
      - prometheus
      - loki
    networks:
      - freedium_obs_net
    restart: unless-stopped

networks:
  freedium_obs_net:
    driver: bridge

volumes:
  prom_data:
  loki_data:
  grafana_data:
  promtail_data:
  errored_logs:
  mongo_data:
