auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2020-10-24
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 720h  # 30 days
  allow_structured_metadata: true
  # Now that every freedium container ships logs, the default 4MB/s
  # ingestion limit is exceeded by the (DEBUG-heavy) backend. Raise it.
  # TODO: also drop the backend loguru level from DEBUG → INFO to cut volume.
  ingestion_rate_mb: 16
  ingestion_burst_size_mb: 32
  per_stream_rate_limit: 8MB
  per_stream_rate_limit_burst: 16MB

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem
