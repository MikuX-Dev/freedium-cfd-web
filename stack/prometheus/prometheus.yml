global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: freedium-backend
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:7080"]
        labels:
          service: backend

  - job_name: freedium-web
    metrics_path: /metrics
    static_configs:
      - targets: ["web:3000"]
        labels:
          service: web

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
