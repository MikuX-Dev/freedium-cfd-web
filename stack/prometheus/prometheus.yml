global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: freedium-backend
    metrics_path: /metrics
    # backend runs as N replicas (no fixed DNS name → a static target would
    # scrape only one via DNS round-robin and undercount domain metrics).
    # Discover every backend container via the Docker API and scrape each on
    # 7080.
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        port: 7080
    relabel_configs:
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        regex: backend
        action: keep
      - source_labels: [__meta_docker_network_ip]
        target_label: __address__
        replacement: "${1}:7080"
      - target_label: service
        replacement: backend
      - source_labels: [__meta_docker_container_name]
        target_label: instance

  - job_name: freedium-web
    metrics_path: /metrics
    static_configs:
      - targets: ["web:3000"]
        labels:
          service: web

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: freedium-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["worker:8079"]
        labels:
          service: worker

  - job_name: cadvisor
    metrics_path: /metrics
    static_configs:
      - targets: ["cadvisor:8080"]
        labels:
          service: cadvisor

  - job_name: traefik
    metrics_path: /metrics
    static_configs:
      - targets: ["traefik:8082"]
        labels:
          service: traefik
