server:
  http_listen_port: 9080
  log_level: warn

positions:
  filename: /var/lib/promtail/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # All freedium container stdout/stderr (worker, scheduler, backend, web,
  # mongo, redis, traefik, …) via Docker service discovery. Lets us query
  # e.g. {container="freedium-worker"} in Grafana for TaskIQ worker state.
  - job_name: docker-containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 10s
    relabel_configs:
      # Only this stack's containers (the host runs unrelated ones too).
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(freedium.*)"
        action: keep
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: container
      - source_labels: ["__meta_docker_container_log_stream"]
        target_label: stream

  - job_name: freedium-errored-links
    static_configs:
      - targets: ["localhost"]
        labels:
          job: freedium
          source: errored_links
          __path__: /var/log/freedium/errored-links.jsonl

    pipeline_stages:
      # The line is loguru's serialized JSON; the real payload lives under
      # record.extra.
      - json:
          expressions:
            extra: record.extra
      - json:
          source: extra
          expressions:
            kind: kind
            host: host
            status: status
            url: url
            error: error
      - labels:
          kind:
          host:
          status:
      # Write a clean JSON line back so the URL stays queryable via |=
      - output:
          source: extra
