http:
  # Production note:
  # Public traffic enters via the edge HAProxy at 146.103.108.112 which
  # terminates TLS for freedium.cfd / freedium-mirror.cfd and forwards
  # plain HTTP to this Traefik on host port 18080. Dev hostnames
  # (*.localhost) remain so local docker compose up still works.
  routers:
    # Block /cdn-cgi/* (Cloudflare probe paths bots scan for) at the edge of
    # the stack — highest priority so it wins over every other route. The
    # block-cdn-cgi middleware (an ipAllowList with an impossible source)
    # rejects with 403 before anything is forwarded to web/backend.
    cdn-cgi-block:
      rule: "PathPrefix(`/cdn-cgi/`)"
      priority: 1000
      entryPoints:
        - web
      service: web  # required, but the middleware denies before forwarding
      middlewares:
        - block-cdn-cgi
    # Leftover static asset from the old Caddy deployment. Bots/crawlers
    # still request it. Block at the edge so it never hits web.
    tailwind-hotfix-block:
      rule: "Path(`/tailwindcssv3-freedium-hotfix.js`)"
      priority: 1000
      entryPoints:
        - web
      service: web
      middlewares:
        - block-cdn-cgi


    # freedium.cfd is 301-redirected to freedium-mirror.cfd by the edge
    # HAProxy at 146.103.108.112 — Traefik only ever sees the canonical
    # domain, so we don't need it in the Host() match.
    # Image proxy: /img/{width}/{id} is served by the backend (Mongo
    # image_cache + WARP-on-miss), NOT the SvelteKit web tier. Higher
    # priority than `web` so it wins on the /img/ prefix; everything
    # else still falls through to web. Backend stays otherwise internal.
    images:
      rule: "(Host(`freedium.localhost`) || Host(`freedium-mirror.cfd`)) && PathPrefix(`/img/`)"
      priority: 100
      entryPoints:
        - web
      service: backend

    web:
      rule: "Host(`freedium.localhost`) || Host(`freedium-mirror.cfd`)"
      entryPoints:
        - web
      service: web

    grafana:
      # Dev-only. Don't expose grafana publicly — access via SSH tunnel.
      rule: "Host(`grafana.localhost`)"
      entryPoints:
        - web
      service: grafana

    dashboard:
      # Dev-only. The Traefik dashboard exposes the routing table; never
      # serve it on a public hostname without forwardAuth + IP allowlist.
      rule: "Host(`traefik.localhost`)"
      entryPoints:
        - web
      service: api@internal

  middlewares:
    # Deny everything: an ipAllowList whose only allowed source is an
    # impossible address, so every real request to /cdn-cgi/* gets 403.
    # (Traefik OSS has no native "return 403" middleware; this is the
    # idiomatic way to block a path.)
    block-cdn-cgi:
      ipAllowList:
        sourceRange:
          - "255.255.255.255/32"

  services:
    web:
      loadBalancer:
        servers:
          - url: "http://web:3000"

    backend:
      loadBalancer:
        servers:
          - url: "http://backend:7080"

    grafana:
      loadBalancer:
        servers:
          - url: "http://grafana:3000"
