http:
  # Production note:
  # Public traffic enters via the edge HAProxy at 146.103.108.112 which
  # terminates TLS for freedium.cfd / freedium-mirror.cfd and forwards
  # plain HTTP to this Traefik on host port 18080. Dev hostnames
  # (*.localhost) remain so local docker compose up still works.
  routers:
    web:
      rule: "Host(`freedium.localhost`, `freedium.cfd`, `freedium-mirror.cfd`)"
      entryPoints:
        - web
      service: web

    grafana:
      rule: "Host(`grafana.localhost`, `grafana.freedium.cfd`)"
      entryPoints:
        - web
      service: grafana

    dashboard:
      rule: "Host(`traefik.localhost`, `traefik.freedium.cfd`)"
      entryPoints:
        - web
      service: api@internal

  services:
    web:
      loadBalancer:
        servers:
          - url: "http://web:3000"

    grafana:
      loadBalancer:
        servers:
          - url: "http://grafana:3000"
