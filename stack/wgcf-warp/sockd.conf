debug: 0
logoutput: stderr
internal: 0.0.0.0 port = 1080
external: wgcf
# Anonymous SOCKS5 (no auth). Listing "username none" together causes
# danted to busy-loop at 100% CPU and return malformed replies when
# clients negotiate the "none" method.
socksmethod: none
clientmethod: none
user.privileged: root
user.unprivileged: nobody

client pass {
    from: 0.0.0.0/0 port 1-65535 to: 0.0.0.0/0
    log: error
}

socks pass {
    from: 0.0.0.0/0 to: 0.0.0.0/0
    log: error
}
